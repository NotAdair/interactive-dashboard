<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>
   
    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Adair Barrios-Perez for the WEB-115 course at Wake Tech</p>
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>

  
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>

    <div class="container">
        <div class="row">
            <div class="col" id="weekly-tasks">
                <form id="goal-form">
                    <div>
                        <label for="userName">Name:</label>
                        <input type="text" id="userName">
                    </div>
                    <div>
                        <label for="dailyGoal">Daily Task Goal:</label>
                        <input type="number" id="dailyGoal">
                    </div>
                    <div>
                        <label for="bonusTasks">Weekly Bonus Tasks:</label>
                        <input type="number" id="bonusTasks">
                    </div>
                    <button type="button" id="goal-btn">Calculate</button>
                </form>
                <p id="goal-message"></p>

                <!-- external js file linked-->
                <script src="js/task-manager.js"></script>

            </div>
        </div>
     </div>
</body>
</html>
