<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>
   
    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Adair Barrios-Perez for the WEB-115 course at Wake Tech</p>
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>

  
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>

    <div class="container">
        <div class="row">
            <div class="col" id="weekly-tasks">
                <form id="goal-form">
                    <div>
                        <label for="userName">Name:</label>
                        <input type="text" id="userName">
                    </div>
                    <div>
                        <label for="dailyGoal">Daily Task Goal:</label>
                        <input type="number" id="dailyGoal">
                    </div>
                    <div>
                        <label for="bonusTasks">Weekly Bonus Tasks:</label>
                        <input type="number" id="bonusTasks">
                    </div>
                    <button type="button" id="goal-btn">Calculate</button>
                </form>
                <p id="goal-message"></p>

                <!-- external js file linked-->
                <script src="js/task-manager.js"></script>

            </div>
            <div class="col" id="metric-converter">
                <h2>Imperial/Metric Converter</h2>
                <form id="converter-form">
                    <div>
                        <label for="val-input">Value:</label>
                        <input type="number" id="val-input" step="any" placeholder="Enter number" required>
                    </div>
                    <div>
                        <label for="conversion-select">Conversion Type:</label>
                        <select id="conversion-select">
                            <option value="in-to-cm">Inches (in) to Centimeters (cm)</option>
                            <option value="ft-to-cm">Feet (ft) to Centimeters (cm)</option>
                            <option value="yd-to-m">Yards (yd) to Meters (m)</option>
                            <option value="mi-to-km">Miles (mi) to Kilometers (km)</option>
                            <option value="cm-to-in">Centimeters (cm) to Inches (in)</option>
                            <option value="cm-to-ft">Centimeters (cm) to Feet (ft)</option>
                            <option value="m-to-yd">Meters (m) to Yards (yd)</option>
                            <option value="km-to-mi">Kilometers (km) to Miles (mi)</option>
                        </select>
                    </div>
                    <button type="button" id="convert-btn">Convert</button>
                </form>
                <!-- output -->
                <div id="converter-result"></div>
                <!-- linked script-->
                <script src="js/metric-converter.js" defer></script>
            </div>
        </div>
     </div>
</body>
</html>
